name: attendance
description: "AttendEase - attendance app for Akal University."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Backend (database + realtime). 2.15.x is the newest version that
  # works with Flutter 3.32. After upgrading Flutter to 3.35 or newer
  # you can change this to the latest 2.x version.
  supabase_flutter: ^2.15.4

  # Excel reports (.xlsx) and saving them (download on web,
  # "Save as" on Android). These versions work with Flutter 3.32.
  excel: ^4.0.6
  file_saver: ^0.3.1

  # Leave photo (camera / gallery) and phone notifications.
  # These versions work with Flutter 3.32.
  image_picker: ^1.1.2
  flutter_local_notifications: ^20.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
